services:
  baza:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: konsultacje
      POSTGRES_USER: konsultacje
      POSTGRES_PASSWORD: konsultacje
    volumes:
      - ./baza/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konsultacje"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: baza
      DB_PORT: 5432
      DB_USER: konsultacje
      DB_PASSWORD: konsultacje
      DB_NAME: konsultacje
    depends_on:
      baza:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      retries: 10
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"