services:
  baza:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: konsultacje
      POSTGRES_USER: konsultacje
      POSTGRES_PASSWORD: konsultacje
    volumes:
      - ./baza/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konsultacje"]
      interval: 5s
      retries: 10

      
  backend:
    build: ./backend
    environment:
      DB_HOST: baza
      DB_USER: konsultacje
      DB_PASSWORD: konsultacje
      DB_NAME: konsultacje
    depends_on:
      baza:
        condition: service_healthy
    ports:
      - "3001:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"